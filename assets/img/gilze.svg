<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
 <linearGradient id="br" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#5a3c14"/><stop offset=".12" stop-color="#a7752e"/>
  <stop offset=".3" stop-color="#e6c27a"/><stop offset=".4" stop-color="#f6dfa4"/>
  <stop offset=".52" stop-color="#c8963f"/><stop offset=".8" stop-color="#8a5d22"/>
  <stop offset="1" stop-color="#4a3010"/></linearGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#4c3210"/><stop offset=".35" stop-color="#d9b065"/>
  <stop offset=".5" stop-color="#b7853a"/><stop offset="1" stop-color="#3d280c"/></linearGradient>
 <radialGradient id="base" cx=".45" cy=".4" r=".6">
  <stop offset="0" stop-color="#d8b06a"/><stop offset=".7" stop-color="#9a6a2a"/><stop offset="1" stop-color="#5a3a12"/></radialGradient>
 <filter id="nois" x="0" y="0" width="1" height="1">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/>
  <feColorMatrix values="0 0 0 0 .25  0 0 0 0 .17  0 0 0 0 .07  0 0 0 1.4 -.55"/>
  <feComposite in2="SourceGraphic" operator="in"/></filter>
 <filter id="pat" x="0" y="0" width="1" height="1">
  <feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="3" seed="11"/>
  <feColorMatrix values="0 0 0 0 .22  0 0 0 0 .22  0 0 0 0 .12  0 0 0 2.2 -1.15"/>
  <feComposite in2="SourceGraphic" operator="in"/></filter>
 <filter id="rust" x="0" y="0" width="1" height="1">
  <feTurbulence type="fractalNoise" baseFrequency=".12" numOctaves="2" seed="23"/>
  <feColorMatrix values="0 0 0 0 .42  0 0 0 0 .20  0 0 0 0 .07  0 0 0 3.0 -1.95"/>
  <feComposite in2="SourceGraphic" operator="in"/></filter>
 <filter id="sh"><feGaussianBlur stdDeviation="4"/></filter>
 <clipPath id="body"><path d="M18 76 L176 80 V120 L18 124 Z"/></clipPath>
</defs>
<ellipse cx="102" cy="168" rx="80" ry="10" fill="#000" opacity=".35" filter="url(#sh)"/>
<g transform="rotate(-38 100 100)">
 <!-- korpusas -->
 <g clip-path="url(#body)">
  <rect x="10" y="74" width="175" height="52" fill="url(#br)"/>
  <rect x="10" y="74" width="175" height="52" fill="#000" filter="url(#nois)"/>
  <rect x="10" y="74" width="175" height="52" fill="#000" filter="url(#pat)"/>
  <rect x="10" y="74" width="175" height="52" fill="#000" filter="url(#rust)"/>
  <!-- įbrėžimai -->
  <g stroke="#fff3cf" stroke-opacity=".35" stroke-width=".6" fill="none">
   <path d="M40 92 L95 89"/><path d="M60 104 L130 101"/><path d="M110 95 L150 94"/></g>
  <g stroke="#3a250b" stroke-opacity=".35" stroke-width=".7" fill="none">
   <path d="M30 110 L80 111"/><path d="M120 108 L160 106"/></g>
  <!-- žiotys (siauresnė dalis) -->
  
 </g>
 <!-- angos kraštas -->
 <ellipse cx="176" cy="100" rx="6" ry="20" fill="#c99a4c" stroke="#5a3c14" stroke-width="1"/>
 <ellipse cx="177" cy="100" rx="4.4" ry="17.5" fill="#1a1006"/>
 <!-- griovelis ir dugno briauna -->
 <rect x="14" y="78" width="6" height="44" fill="#3b260b"/>
 <rect x="4" y="71" width="11" height="58" rx="2" fill="url(#rim)"/>
 <rect x="4" y="71" width="11" height="58" rx="2" fill="#000" filter="url(#rust)"/>
 <ellipse cx="4" cy="100" rx="5" ry="29" fill="url(#base)"/>
 <ellipse cx="2.5" cy="100" rx="2" ry="8" fill="#7a5420" stroke="#3b260b" stroke-width=".6"/>
 <!-- kontūras -->
 <path d="M18 76 L176 80 M176 120 L18 124" fill="none" stroke="#2c1c07" stroke-width="1.2" stroke-opacity=".7"/>
</g>
</svg>
